name: CI/CD — API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/ci-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: SSH → EC2 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/siren
            git pull origin main
            docker compose pull
            docker compose up -d --build
            docker compose ps
