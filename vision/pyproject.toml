# vision/pyproject.toml

[tool.black]
line-length = 88
target-version = ["py311"]
exclude = '''
/(
    \.venv
  | venv
  | __pycache__
  | data
  | datasets
  | runs
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
exclude = .venv, venv, __pycache__, data, datasets, runs
extend-ignore = E203, W503