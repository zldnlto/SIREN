# Split/sampling policy is driven by the training layer contract.
# review_train_cap = 0 means taxonomy review candidates are excluded from the
# default train export and kept only for reports/RAG/manual review.
support_buckets:
  regular_min_unique_images: 1000
  tail_min_unique_images: 100
train_caps:
  regular: 5000
  tail: 1000
  review: 0
validation_policy: natural
area_aware_weights:
  tiny: 2.0
  small: 1.5
  medium: 1.0
  large: 0.8
