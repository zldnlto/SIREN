# api/pyproject.toml

[tool.black]
line-length = 88
target-version = ["py311"]
exclude = '''
/(
    \.venv
  | venv
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
exclude = [".venv", "venv", "__pycache__"]
extend-ignore = ["E203", "W503"]

# api/pyproject.toml 에 추가

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "routers → services만 호출 가능"
type = "layers"
layers = [
    "app.routers",
    "app.services",
    "app.models",
]

[[tool.importlinter.contracts]]
name = "routers는 models 직접 접근 금지"
type = "forbidden"
source_modules = ["app.routers"]
forbidden_modules = ["app.models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", "venv", "__pycache__"]