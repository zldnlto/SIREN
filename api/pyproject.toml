# api/pyproject.toml

[tool.black]
line-length = 88
target-version = ["py311"]
exclude = '''
/(
    \.venv
  | venv
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
exclude = [".venv", "venv", "__pycache__"]
extend-ignore = ["E203", "W503"]

# api/pyproject.toml 에 추가

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "inbound → application → domain → ports → adapters"
type = "layers"
layers = [
    "app.routers",
    "app.services",
    "app.application",
    "app.domain",
    "app.ports",
    "app.repositories",
    "app.models",
    "app.core",
]

[[tool.importlinter.contracts]]
name = "application은 adapter를 직접 import하지 않는다"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.repositories", "app.core", "app.models"]

[[tool.importlinter.contracts]]
name = "domain은 adapter와 HTTP를 모른다"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.application", "app.services", "app.routers", "app.repositories", "app.core", "app.models", "app.schemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", "venv", "__pycache__"]
